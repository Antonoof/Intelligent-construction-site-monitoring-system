# Обучение модели стадии и прогресса стройки: DINOv2 (заморожен) + RF-DETR (заморожен) + обучаемая голова.
# Относительные пути считаются от корня репозитория.

paths:
  videos_dir: "videos for train"                 # таймлапсы: первый кадр = 0% готовности, последний = 100%
  frames_dir: training/data/frames               # шаг 0: кадры + frames.csv с метками
  features_dir: training/data/features           # шаг 1: кеш признаков DINOv2 и RF-DETR
  runs_dir: training/runs                        # шаг 2: обученные головы
  predictions_dir: predictions                   # шаг 3: предсказания, отдельно от обучения
  rfdetr_weights: weights/rfdetr_large_best_ema.pth

frames:
  per_video: 1200        # равномерно по всему видео; у каждого видео одинаковый вес в обучении
  max_width: 1280        # кадры сохраняются 1280×720: этого хватает и DINOv2, и RF-DETR (736 px)
  jpeg_quality: 92

# Стадии строительства как доли общей готовности. Метка стадии кадра = стадия, в которую попадает его прогресс.
# Это приближение: у разных объектов стадии занимают разную долю срока.
# Точнее — задать границы для каждого видео в videos.<файл>.stage_until (ниже).
stages:
  - {id: S1, name: "Подготовка и котлован",        until: 0.15}
  - {id: S2, name: "Фундамент и подземная часть",  until: 0.30}
  - {id: S3, name: "Возведение каркаса",           until: 0.65}
  - {id: S4, name: "Фасад и инженерные системы",   until: 0.85}
  - {id: S5, name: "Отделка и благоустройство",    until: 1.00}

# Настройки отдельных видео (необязательно).
#   stage_until — свои границы стадий (5 чисел по возрастанию, последнее 1.0)
#   plan_finish — в какой доле видео по плану должна закончиться стройка:
#                 1.0 — план совпадает с фактом; 0.8 — по плану должны были закончить раньше → отставание
#   total_days  — плановая длительность стройки в днях, чтобы перевести отклонение в дни
#   plan_start, plan_end — плановые даты (ГГГГ-ММ-ДД); если заданы, план по дате кадра считается по ним
#   tiles       — детекция техники по фрагментам кадра: для общих планов с высоты, где техника мелкая
videos:
  video1.mp4: {}
  video2.mp4: {}
  video3.mp4: {}
  video4.mp4: {tiles: 3}   # общий план с высоты: на фрагментах 3×3 RF-DETR находит бетоносмеситель

backbone:
  # DINOv2 ViT-g/14 (1.1 млрд параметров, открытые веса). DINOv3 тоже поддерживается: facebook/dinov3-*
  name: facebook/dinov2-giant
  image_size: [432, 768]   # h, w; размер подрезается до кратного патчу (14 → 420×756), пропорция 16:9
  grid: [9, 16]            # патч-токены усредняются до сетки 9×16 = 144 токена: хватает для карты внимания
  dtype: bfloat16
  batch_size: 4

detector:
  threshold: 0.3
  tiles: 1                # рамки техники по сетке tiles×tiles фрагментов; своё значение — videos.<файл>.tiles

head:
  hidden: 512
  epochs: 40
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.05
  token_dropout: 0.1       # случайно выключает 10% патчей: голова не цепляется за один участок кадра
  stage_weight: 0.5        # вес лосса стадии относительно лосса прогресса
  holdout_video: null      # имя видео, которое не участвует в обучении, — для честной проверки обобщения

plan:
  total_days: 540          # по умолчанию стройка длится 1.5 года
  ahead: 0.03              # прогресс выше плана больше чем на 3 п.п. → опережение
  risk: -0.03              # ниже плана на 3–8 п.п. → риск
  late: -0.08              # ниже плана больше чем на 8 п.п. → отставание

predict:
  trajectory_frames: 48    # кривая «готовность по всему видео»: столько кадров видео через ту же модель, что и сам кадр

# Экранная дата камеры (EasyOCR). Если дата на кадре есть, план считается по календарю:
# начало и конец съёмки видео распознаются по первому и последнему кадру (или задаются plan_start / plan_end).
ocr:
  enabled: true

# Детектор «любых объектов по тексту» — показывает рамками то, чего нет среди 10 классов техники.
open_vocab:
  enabled: true
  model: IDEA-Research/grounding-dino-base
  threshold: 0.4            # ниже 0.4 модель находит «опалубку» в логотипах и «стройку» в старых домах
  # английские подсказки → русские подписи; слова в подсказках не должны повторяться,
  # иначе часть фразы, которую вернёт модель, нельзя однозначно сопоставить
  prompts:
    worker: рабочий
    scaffolding: леса
    formwork: опалубка
    unfinished building: {ru: строящееся здание, threshold: 0.55}   # часто путает со старыми домами
    excavation pit: котлован
    fence: ограждение

# Модель-свидетель: независимо описывает кадр словами и голосует за стадию.
# Если её стадия совпала с предсказанием головы — вывод подтверждён.
vlm:
  enabled: true
  model: Qwen/Qwen3-VL-8B-Instruct   # ~17 ГБ в bf16; загружается после выгрузки DINOv2
  max_new_tokens: 160
