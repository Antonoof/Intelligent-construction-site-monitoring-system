# Grounding DINO — детектор «любых объектов по тексту» (как open_vocab в training/config.yaml ML-части).
#
# objects   — то, чего нет среди классов техники: признаки работ там, где машин мало (монолит, фасад).
#             Каждая фраза — отдельный запрос к модели: подпись рамки однозначно равна фразе.
#             Значение — русская подпись или {ru: подпись, threshold: свой порог}.
# equipment — техника одним запросом: проверка детектора RF-DETR. Рамки, которых нет у RF-DETR, уходят в ИИ-анализ
#             как кандидаты в пропущенную технику. Слова в фразах не повторяются — по ответу модели фраза
#             определяется однозначно. Значение — ключ класса из equipment.yaml.
model: IDEA-Research/grounding-dino-base
threshold: 0.4              # ниже 0.4 модель находит «опалубку» в логотипах и «стройку» в старых домах
max_area: 0.6               # рамка больше этой доли кадра — модель «нашла» фразу во всей сцене, отбрасываем

objects:
  worker: рабочий
  scaffolding: леса
  formwork: опалубка
  unfinished building: {ru: строящееся здание, threshold: 0.55}   # часто путает со старыми домами
  excavation pit: котлован
  fence: ограждение

equipment:
  threshold: 0.35
  prompts:
    excavator: excavator
    dump truck: dump_truck
    wheel loader: loader
    bulldozer: bulldozer
    concrete mixer: concrete_mixer
    road roller: roller
    grader: grader
    drilling rig: drilling_rig
