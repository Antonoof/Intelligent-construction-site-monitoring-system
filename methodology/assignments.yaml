# Привязка видов работ справочника организаторов к профилям техники и стадиям S1–S5.
#
# Правила наследования (tools/build_methodology.py):
#   * профиль: свой → профиль ближайшего предка с явным профилем → для групп без профиля
#     составной профиль COMPOSITE:<id> из профилей подпунктов (объединение техники);
#   * стадия: своя → стадия ближайшего предка;
#   * observability можно переопределить на строке (например, по замечаниям экспертов).
#
# Стадии совпадают со стадиями модели готовности из ML-части:
#   S1 подготовка и котлован · S2 фундамент и подземная часть · S3 каркас ·
#   S4 фасад и инженерные системы · S5 отделка и благоустройство.
