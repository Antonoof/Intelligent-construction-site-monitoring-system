<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plan-Fact Site Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Oswald:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--surface-2:#F5F7F9;--surface-3:#E3E8ED;
  --line:#D6DDE4;--line-2:#B8C2CD;
  --ink:#111922;--ink-2:#434F5C;--muted:#687480;
  --accent:#256ABF;--accent-2:#1C5CAB;--accent-soft:#E2ECF9;--on-accent:#FFFFFF;
  --good:#0CA30C;--warn:#FAB219;--serious:#EC835A;--crit:#D03B3B;--info:#4A3AA7;--nodata:#898781;
  --good-bg:rgba(12,163,12,.12);--warn-bg:rgba(250,178,25,.2);--serious-bg:rgba(236,131,90,.18);--crit-bg:rgba(208,59,59,.11);--info-bg:rgba(74,58,167,.1);--nodata-bg:rgba(137,135,129,.16);
  --axis:#B8C2CD;--grid:#E4E9EE;--s1:#2A78D6;--s1-wash:rgba(42,120,214,.14);--present:#52514E;--rain:rgba(42,120,214,.09);
  --hazard:#F2B705;--hazard-ink:#16191C;
  --shadow:0 1px 2px rgba(17,25,34,.06),0 8px 24px rgba(17,25,34,.08);
  --f-display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0B1016;--surface:#121921;--surface-2:#172029;--surface-3:#1F2A35;--line:#25313D;--line-2:#374553;
    --ink:#E6EBF1;--ink-2:#AAB5C2;--muted:#7E8A97;
    --accent:#3987E5;--accent-2:#6DA7EC;--accent-soft:#16263B;--on-accent:#06101C;
    --info:#9085E9;
    --good-bg:rgba(12,163,12,.2);--warn-bg:rgba(250,178,25,.17);--serious-bg:rgba(236,131,90,.2);--crit-bg:rgba(208,59,59,.22);--info-bg:rgba(144,133,233,.18);--nodata-bg:rgba(137,135,129,.2);
    --axis:#3A4756;--grid:#212C37;--s1:#3987E5;--s1-wash:rgba(57,135,229,.2);--present:#C3C2B7;--rain:rgba(57,135,229,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0B1016;--surface:#121921;--surface-2:#172029;--surface-3:#1F2A35;--line:#25313D;--line-2:#374553;
  --ink:#E6EBF1;--ink-2:#AAB5C2;--muted:#7E8A97;
  --accent:#3987E5;--accent-2:#6DA7EC;--accent-soft:#16263B;--on-accent:#06101C;
  --info:#9085E9;
  --good-bg:rgba(12,163,12,.2);--warn-bg:rgba(250,178,25,.17);--serious-bg:rgba(236,131,90,.2);--crit-bg:rgba(208,59,59,.22);--info-bg:rgba(144,133,233,.18);--nodata-bg:rgba(137,135,129,.2);
  --axis:#3A4756;--grid:#212C37;--s1:#3987E5;--s1-wash:rgba(57,135,229,.2);--present:#C3C2B7;--rain:rgba(57,135,229,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
@media (min-width:900px){.app{padding-inline:24px}}
body.guiding .app{padding-bottom:150px}

/* header */
.hdr{background:var(--bg);padding-block:12px 0}
@media (min-width:900px){.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 1px 0 var(--line)}}
.hdr-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;flex:none}
.logo .lg-bg{fill:var(--accent)}.logo .lg-fg{fill:var(--on-accent)}.logo .lg-dim{fill:var(--on-accent);opacity:.55}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.05;letter-spacing:.03em;text-transform:uppercase}
.brand-sub{font-size:13px;color:var(--ink-2)}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface-3)}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;line-height:1.3;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent-2)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-icon{padding:6px}
.link{border:0;background:none;padding:0;color:var(--accent-2);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* time bar */
.timebar{margin-top:12px;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px 18px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tb-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clock{display:flex;flex-direction:column;min-width:92px}
.clock b{font-family:var(--f-mono);font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:11px;color:var(--muted);margin-top:4px}
.trk{position:relative;min-width:0;padding-top:6px}
.track{position:relative;height:28px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.trk:focus-within .track{outline:2px solid var(--accent);outline-offset:2px}
.t-done{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);border-radius:5px 0 0 5px}
.t-rain{position:absolute;top:0;bottom:0;background:var(--rain);border-inline:1px solid var(--s1-wash)}
.t-rain span{position:absolute;left:5px;top:5px;font-size:10.5px;color:var(--ink-2);white-space:nowrap;display:flex;gap:3px;align-items:center}
.t-rain svg{width:11px;height:11px;color:var(--s1)}
.t-nd{position:absolute;height:5px;background:repeating-linear-gradient(135deg,var(--nodata) 0 3px,transparent 3px 6px)}
.t-pin{position:absolute;top:-8px;width:16px;height:16px;margin-left:-8px;border:0;padding:0;background:none;cursor:pointer;z-index:3}
.t-pin i{display:block;width:10px;height:10px;margin:3px;transform:rotate(45deg);background:var(--pc,var(--ink-2));outline:2px solid var(--surface);border-radius:2px}
.t-head{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:2}
#scrub{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.t-axis{position:relative;height:14px;margin-top:4px;font:11px/1 var(--f-mono);color:var(--muted)}
.t-axis span{position:absolute;top:0;transform:translateX(-50%)}
.t-axis span:first-child{transform:none}.t-axis span:last-child{transform:translateX(-100%)}
.t-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:11px;color:var(--muted)}
.t-legend span{display:inline-flex;align-items:center;gap:5px}
.t-legend i{display:inline-block;width:14px;height:9px;border-radius:2px}
.lg-rain{background:var(--rain);border:1px solid var(--s1-wash)}
.lg-nd{background:repeating-linear-gradient(135deg,var(--nodata) 0 3px,transparent 3px 6px)}
.t-legend i.lg-pin{width:8px;height:8px;transform:rotate(45deg);background:var(--ink-2)}
@media (max-width:899px){.timebar{grid-template-columns:1fr auto}.trk{grid-column:1/-1}.tb-end{grid-column:1/-1;justify-self:start}}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;border-bottom:2px solid transparent;background:none;padding:10px 12px 9px;color:var(--ink-2);font-weight:500;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-3);font:600 11px/1 var(--f-mono);color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}
.bdg{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.bdg.hot{background:var(--crit-bg);color:var(--ink)}
.bdg.warm{background:var(--warn-bg);color:var(--ink)}

/* layout */
.layout{display:grid;gap:16px;margin-top:16px;align-items:start}
@media (min-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 336px}}
.stack{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.3;letter-spacing:.07em;text-transform:uppercase}
.panel-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.small{font-size:12px}.muted{color:var(--muted)}.mono{font-family:var(--f-mono)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.two{display:grid;gap:16px}
@media (min-width:980px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;background:var(--cbg,var(--surface-3));color:var(--ink)}
.chip svg{width:13px;height:13px;flex:none;color:var(--cc,var(--muted))}
.k-good{--cc:var(--good);--cbg:var(--good-bg)}
.k-warn{--cc:var(--warn);--cbg:var(--warn-bg)}
.k-serious{--cc:var(--serious);--cbg:var(--serious-bg)}
.k-crit{--cc:var(--crit);--cbg:var(--crit-bg)}
.k-info{--cc:var(--info);--cbg:var(--info-bg)}
.k-nodata{--cc:var(--nodata);--cbg:var(--nodata-bg)}
.k-plain{--cc:var(--muted);--cbg:var(--surface-3)}
.zchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.zchip i{width:9px;height:9px;border-radius:2px;background:var(--zc)}

/* cameras */
.cams{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.cam{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-width:0}
.cam-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;font-size:12px}
.cam-h .id{font:600 12px var(--f-mono);flex:none}
.cam-h .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.camsvg{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0B0F14}
.cam-f{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:7px 10px;font-size:12px;color:var(--ink-2)}
.camsvg .osd{font:600 8.5px var(--f-mono);fill:#fff;paint-order:stroke;stroke:#000;stroke-opacity:.55;stroke-width:2.2px}
.camsvg .bx{font:600 7px var(--f-mono);fill:#10161D}
.camsvg .zl{font:600 7.5px var(--f-mono)}
.camsvg .big{font:600 14px var(--f-mono);fill:#F2B705;letter-spacing:.08em}
.camsvg .sub{font:500 8.5px var(--f-mono);fill:#C9D1D9}
.camsvg .vtx{cursor:grab}
.camsvg .vtx:focus{outline:none;stroke-width:3.5}
.editor{touch-action:none}
.editor .camsvg{border-radius:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--accent)}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:6px 10px;text-align:left;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.has-m td{border-bottom:0}
tr.m td{padding-top:0}
.sn{font-weight:500}.ss{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent-2);font-size:12px;font-weight:500;width:max-content}
.math{font:12px/1.65 var(--f-mono);color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.math div{white-space:pre-wrap}
.math b{color:var(--ink);font-weight:600}

/* timeline small multiples */
.tl-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.tl-legend span,.g-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:10px;border-radius:2px}
.sw-line{height:0;border-top:2px solid var(--present);border-radius:0}
.sw-work{background:var(--s1-wash);border-top:2px solid var(--s1);border-radius:0}
.sw-plan{height:0;border-top:1.5px dashed var(--muted);border-radius:0}
.sw-rain{background:var(--rain);border:1px solid var(--s1-wash)}
.sw-nd{background:var(--nodata-bg)}
.tl-row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:4px 14px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tl-rows .tl-row:first-child{border-top:0}
.tl-lbl{font-size:12.5px;line-height:1.35;min-width:0}
.tl-lbl .sn{display:block}
.tl-plot{position:relative;height:54px;touch-action:pan-y;cursor:crosshair}
.tl-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl-x{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink-2);pointer-events:none}
.tl-axis{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}
.tl-axis>div{position:relative;height:16px;font:11px/1 var(--f-mono);color:var(--muted)}
.tl-axis span{position:absolute;top:3px;transform:translateX(-50%)}
.tl-axis span:first-child{transform:none}.tl-axis span:last-child{transform:translateX(-100%)}
@media (max-width:640px){.tl-row,.tl-axis{grid-template-columns:minmax(0,1fr)}.tl-axis>div:first-child{display:none}}
.tl-rain{fill:var(--rain)}.tl-nd{fill:var(--nodata-bg)}.tl-base{stroke:var(--axis);stroke-width:1}
.tl-plan{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.tl-warea{fill:var(--s1-wash)}
.tl-wline{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round}
.tl-pline{fill:none;stroke:var(--present);stroke-width:1.5;stroke-linejoin:round}
.tl-plot svg *{vector-effect:non-scaling-stroke}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:180px;max-width:300px}
.tip .th{font-weight:600;margin-bottom:4px}
.tip .tr{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.tip .tr b{font-variant-numeric:tabular-nums}
.tip .tr span{color:var(--ink-2)}

/* review */
.devs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.dev{display:grid;gap:10px;align-content:start;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);min-width:0}
.dev.resolved{background:var(--surface-2)}
.dev.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.dev-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dev-t{font-weight:600;font-size:14.5px;line-height:1.3}
.dev-st{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lbl{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.hyp{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.hyp li{display:flex;gap:8px;align-items:baseline}
.hyp .cf{flex:none;font-size:11px;color:var(--muted);min-width:64px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{border:0;padding:0;background:none;cursor:zoom-in;width:150px;max-width:100%;text-align:left;color:inherit}
.thumb .camsvg{border-radius:6px}
.thumb span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.verdicts{display:flex;gap:6px;flex-wrap:wrap}
.btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.fmrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.corr{display:grid;gap:8px;padding:10px;border:1px dashed var(--line-2);border-radius:8px}
.corr label{display:flex;gap:8px;align-items:center;font-size:13px}
.corr input[type=number]{width:92px;padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
.corr input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.vset{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.vset svg{width:15px;height:15px;color:var(--good);flex:none}
.note{font-size:12.5px;color:var(--ink-2)}
.approve{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.approve p{display:flex;gap:8px;align-items:center}
.approve svg{width:16px;height:16px;color:var(--good)}
.sup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}

/* aside */
.bot{display:grid;gap:10px}
.msg{border:1px solid var(--line);background:var(--surface-2);border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:13px;line-height:1.45}
.msg.alert-m{border-color:var(--crit);background:var(--crit-bg)}
.msg-h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}
.msg-h b{color:var(--ink-2);font-weight:600}
.msg-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg-a button{border:1px solid var(--line-2);background:var(--surface);color:var(--accent-2);border-radius:6px;padding:3px 10px;font-size:12px;font-weight:500;cursor:pointer}
.log{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:12.5px;max-height:460px;overflow:auto}
.log li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:baseline}
.log time{font:11.5px var(--f-mono);color:var(--muted)}

/* dashboard */
.alert{position:relative;overflow:hidden;border:1px solid var(--crit);background:var(--crit-bg);border-radius:10px;padding:14px 16px 14px 28px;display:grid;gap:6px}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 7px,var(--hazard-ink) 7px 14px)}
.alert h3{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.alert h3 svg{width:18px;height:18px;color:var(--crit)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:600;line-height:1.15;display:flex;align-items:center;gap:8px}
.kpi .v svg{width:18px;height:18px;color:var(--cc,var(--muted))}
.kpi .s{font-size:12px;color:var(--ink-2)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-color:transparent}
.notice svg{width:18px;height:18px;flex:none;color:var(--accent-2);margin-top:2px}
.gantt-wrap{overflow-x:auto}
.gantt{display:block;width:100%;min-width:760px;height:auto}
.gantt text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.gantt .g-wbs{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.gantt .g-ax{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.g-grid{stroke:var(--grid);stroke-width:1}
.g-plan{fill:var(--surface-3)}
.g-prog{fill:var(--s1)}
.g-fl-bg{fill:var(--surface)}.g-fl-ln{fill:var(--line-2)}
.g-float{fill:url(#gfl);stroke:var(--line);stroke-width:1}
.g-today{stroke:var(--accent);stroke-width:2}
.gantt .g-today-t{fill:var(--accent-2);font-weight:600;font-size:11px}
.g-d-high{fill:var(--crit)}.g-d-medium{fill:var(--warn)}.g-d-low{fill:var(--good)}
.g-d-high,.g-d-medium,.g-d-low{stroke:var(--surface);stroke-width:2}
.gantt .g-slip{font-size:11px;font-weight:600;font-family:var(--f-mono)}
.g-ghost{fill:none;stroke:var(--crit);stroke-width:1.5;stroke-dasharray:5 3}
.gantt .g-ghost-t{fill:var(--ink-2);font-size:11px}
.g-hit{fill:transparent}
.g-hit:hover{fill:var(--accent-soft);fill-opacity:.5}
.g-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.sw-planb{background:var(--surface-3)}.sw-prog{background:var(--s1)}
.sw-float{background:repeating-linear-gradient(45deg,var(--surface) 0 2px,var(--line-2) 2px 3px);border:1px solid var(--line)}
.sw-dia{width:9px;height:9px;transform:rotate(45deg);background:var(--crit);border-radius:1px}
.sw-today{width:2px;height:12px;background:var(--accent);border-radius:0}
.mini-cams{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.mini-cams figure{margin:0;min-width:0}
.mini-cams figcaption{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.mini-cams .camsvg{border-radius:6px}

/* setup */
.drop{display:grid;gap:12px;justify-items:start;padding:20px;border:1.5px dashed var(--line-2);border-radius:10px;background:var(--surface-2)}
.file{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);margin-bottom:12px}
.file svg{width:22px;height:22px;color:var(--good);flex:none}
.map{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.mapchip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.ref{font-size:11.5px;color:var(--ink);background:var(--warn-bg);padding:1px 6px;border-radius:4px;white-space:nowrap}
.camlist{list-style:none;margin:0;padding:0;display:grid}
.camlist li{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.camlist li:last-child{border-bottom:0}
.camlist .u{font:11.5px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cst{font-size:12px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.cst svg{width:13px;height:13px;flex:none}
.cst.ok svg{color:var(--good)}.cst.bad svg{color:var(--crit)}.cst.wait svg{color:var(--muted)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.camsel{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.camsel button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 8px;font:500 12px var(--f-mono);cursor:pointer;color:var(--ink-2)}
.camsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* guide, toasts, lightbox */
.guide{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.guide-in{max-width:1100px;margin:0 auto;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.guide .ctr{font:600 12px var(--f-mono);opacity:.7;flex:none}
.guide .cap{flex:1 1 360px;font-size:14.5px;line-height:1.45}
.guide .btns{display:flex;gap:8px;flex:none}
.guide .btn{border-color:transparent}
.guide .btn-next{background:var(--hazard);color:var(--hazard-ink);font-weight:600}
.guide .btn-next:hover{background:#FFC928}
.guide .btn-exit{background:transparent;color:var(--bg);border-color:currentColor}
.guide .btn-exit:hover{background:transparent;opacity:.8}
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:80;display:grid;gap:8px;width:min(340px,calc(100vw - 24px))}
.toast{display:flex;gap:8px;align-items:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;animation:tin .25s ease-out}
.toast svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--cc,var(--accent-2))}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.lb{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:16px;background:rgba(5,8,12,.74)}
.lb-in{width:min(980px,100%);background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:8px}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.lb .camsvg{border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

    'The PM uploads the XLS schedule. Columns are matched by their headers, and the storm drain gets its machines from the reference table.',

    'Zones are polygons drawn on each camera frame. Drag a corner and the counts follow each machine’s ground point.',
    'The shift replays at 300×: one snapshot per camera every 5 minutes, each detected once. Watch Pit 2 when rain starts at 10:30.',
    '11:00. The backfill zone has had no machines since 08:00, so the engineer gets an early warning the same morning.',
    '14:00. CAM-3 goes dark. Its frames fail the quality gate and count as “no data”, never as “no machines”.',
    '16:00. The detector reports a mobile crane in Section 3, whose stage starts next week. Confidence is only 0.64.',
    'The shift ends. The engine maps the facts to stages, and every status shows the arithmetic behind it.',
    'The engineer confirms the foundation slab delay: one mixer truck instead of two all day.',
    'The backfill delay is confirmed too.',

    'The “crane” is a manipulator truck. The engineer rejects it, the report recomputes, and 36 frames go to the retraining set.',
    'The engineer approves the report. Only verified findings reach the PM.',
    'The PM gets one alert: the slab slips 3 days against 1 day of float, which pushes the concrete frame by 2 days.',

  const v=a.views[camId];const key=(a.cls==='pump'&&st.working)?'pumpU':a.cls;const dm=DIMS[key];
  let x=v.x;if(st.working&&MOVERS.has(a.cls))x+=MOVE[st.k]*v.s;
  const w=dm[0]*v.s,h=dm[1]*v.s;return {x,y:v.gy-h,w,h,s:v.s,flip:!!v.flip};

  for(const a of ACTORS){

    const p=place(a,cam.id,st);const cls=a.detectAs||a.cls;
    const conf=a.conf!=null?a.conf:clamp(CONF[a.cls]+(rnd(t*13+hstr(a.id+cam.id))-.5)*.06,.5,.99);
    const gp=[p.x+p.w/2,p.y+p.h];const zone=SITEWIDE.has(cls)?null:zoneAt(cam.id,gp);
    out.push({a,cls,conf,working:st.working,st,p,gp,zone});

/* ================= Facts & engine ================= */
const EMPTY=new Set();
function simulate(P,removed,track){

  for(let t=0;t<P;t++){
    const zc={};
    for(const cam of CAMS){
      const zs=Object.keys(state.poly[cam.id]);
      for(const z of zs)if(!zc[z])zc[z]={cov:false,p:{},w:{}};
      if(camStatus(cam,t)!=='ok')continue;
      const per={};for(const z of zs)per[z]={p:{},w:{}};
      for(const d of detect(cam,t)){
        if(removed.has(d.a.id)||!d.zone||!per[d.zone])continue;
        const e=per[d.zone];e.p[d.cls]=(e.p[d.cls]||0)+1;if(d.working)e.w[d.cls]=(e.w[d.cls]||0)+1;
        const mc=acc.minconf[d.zone]||(acc.minconf[d.zone]={});mc[d.cls]=Math.min(mc[d.cls]!=null?mc[d.cls]:1,d.conf);
      }
      for(const z of zs){const e=zc[z];e.cov=true;for(const c in per[z].p)e.p[c]=Math.max(e.p[c]||0,per[z].p[c]);for(const c in per[z].w)e.w[c]=Math.max(e.w[c]||0,per[z].w[c]);}
    }
    for(const z in zc){
      const e=zc[z];if(!e.cov)continue;acc.cov[z]=(acc.cov[z]||0)+1;
      const pr=acc.pres[z]||(acc.pres[z]={}),wk=acc.work[z]||(acc.work[z]={}),mx=acc.maxc[z]||(acc.maxc[z]={});
      for(const c in e.p){pr[c]=(pr[c]||0)+e.p[c];mx[c]=Math.max(mx[c]||0,e.p[c]);}
      for(const c in e.w)wk[c]=(wk[c]||0)+e.w[c];
    }
    series.push(zc);
    if(track){
      const ev=evalStages(acc,t+1);const cur={};for(const id in ev)cur[id]=ev[id].rule;stat.push(cur);
      if(prev){for(const id in cur)if(cur[id]!==prev[id])trans.push({t,id,from:prev[id],to:cur[id]});}
      prev=cur;
    }
  }
  return {acc,series,trans,stat,P};
}
function claimed(z,c){return STAGES.some(x=>x.zone===z&&activeOn(x,TODAY_D)&&x.req.some(r=>r[0]===c));}
function share(s,c){
  const act=STAGES.filter(x=>x.zone===s.zone&&activeOn(x,TODAY_D)&&x.req.some(r=>r[0]===c));
  const tot=act.reduce((m,x)=>m+x.req.find(r=>r[0]===c)[1],0);const mine=s.req.find(r=>r[0]===c)[1];return tot?mine/tot:0;
}

  ov=ov||{};const out={};
  for(const s of STAGES){
    const r={s,active:activeOn(s,TODAY_D)};const cov=acc.cov[s.zone]||0;
    r.cov=cov;r.c=P?cov/P:0;r.planMH=s.req.reduce((m,q)=>m+q[1]*q[2],0);

      r.pMH=p*SLOTMIN/60;r.wMH=w*SLOTMIN/60;

}

function mix(a,b,f){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const ch=s=>Math.round(((pa>>s)&255)*(1-f)+((pb>>s)&255)*f);return '#'+((1<<24)+(ch(16)<<16)+(ch(8)<<8)+ch(0)).toString(16).slice(1);}
function lighting(t){
  let top='#8DB6E2',bot='#DCE8F3';
  if(t<8){top=mix('#A9C4DF',top,t/8);bot=mix('#EADFD2',bot,t/8);}
  if(inR(t,RAIN)){top='#7E8A96';bot='#B7C0C8';}
  const n=clamp((t-114)/16,0,1);
  if(n>0){top=mix(top,'#131B2E',n);bot=mix(bot,'#2A3550',n);}
  return {top,bot,n};
}
function lum(hex){const v=[1,3,5].map(i=>{const c=parseInt(hex.substr(i,2),16)/255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);});return .2126*v[0]+.7152*v[1]+.0722*v[2];}
function inkOn(hex){const l=lum(hex);return (l+.05)/.05>1.05/(l+.05)?'#10161D':'#FFFFFF';}
let UID=0;
function camSVG(cam,t,o){
  o=o||{};const id='c'+(++UID);const st=camStatus(cam,t);const lt=lighting(t);
  let s=`<svg class="camsvg" viewBox="0 0 320 180" role="img" aria-label="${esc(cam.id+' · '+slotTime(t))}"><defs>`+
    `<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lt.top}"/><stop offset="1" stop-color="${lt.bot}"/></linearGradient>`+
    `<pattern id="${id}r" width="7" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(16)"><path d="M3.5 0V5" stroke="#DDE6EF" stroke-opacity=".6" stroke-width=".8"/></pattern>`+
    `<pattern id="${id}h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#15181B"/><rect width="5" height="10" fill="#F2B705"/></pattern>`+
    `<radialGradient id="${id}f" cx=".5" cy=".25" r=".75"><stop offset="0" stop-color="#FFD59A" stop-opacity=".35"/><stop offset="1" stop-color="#FFD59A" stop-opacity="0"/></radialGradient></defs>`;
  if(st==='offline'){
    s+=`<rect width="320" height="180" fill="#171B20"/><rect width="320" height="8" fill="url(#${id}h)"/><rect y="172" width="320" height="8" fill="url(#${id}h)"/>`+
      `<text x="160" y="88" text-anchor="middle" class="big">${esc(tr('noSignal'))}</text><text x="160" y="104" text-anchor="middle" class="sub">${esc(tr('noSignalSub'))}</text>`;
    return s+osd(cam,t)+'</svg>';
  }
  s+=`<rect width="320" height="110" fill="url(#${id}s)"/>`+SCENE[cam.scene]();
  const dets=detect(cam,t);
  const order=dets.slice().sort((a,b)=>((a.cls==='tower_crane')?-1:0)-((b.cls==='tower_crane')?-1:0)||a.gp[1]-b.gp[1]);
  for(const d of order)s+=drawActor(d,t);
  if(inR(t,RAIN))s+=`<rect width="320" height="180" fill="#3C4650" fill-opacity=".16"/><rect width="320" height="180" fill="url(#${id}r)"/>`;
  if(lt.n>0)s+=`<rect width="320" height="180" fill="#081022" fill-opacity="${(.5*lt.n).toFixed(2)}"/><rect width="320" height="180" fill="url(#${id}f)" opacity="${lt.n.toFixed(2)}"/>`;
  if(st==='dark'){
    s+=`<rect width="320" height="180" fill="#050607" fill-opacity=".94"/><text x="160" y="88" text-anchor="middle" class="big">${esc(tr('qgFail'))}</text><text x="160" y="104" text-anchor="middle" class="sub">${esc(tr('qgFailSub'))}</text>`;
  }else{
    if(o.zones)s+=zonesOverlay(cam,o.editor);
    if(o.boxes)s+=boxesOverlay(dets,o.zones);
  }
  return s+osd(cam,t)+'</svg>';
}
function osd(cam,t){return `<text x="6" y="12" class="osd">${cam.id}  01.10.2026  ${slotTime(t)}</text>`;}
function zonesOverlay(cam,editor){
  const P=state.poly[cam.id];let s='';
  for(const z in P){
    const pts=P[z],c=ZONES[z].c;
    s+=`<polygon points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${c}" fill-opacity=".1" stroke="${c}" stroke-width="1.3" stroke-dasharray="5 3"/>`;
    const lab=z+' '+L(ZONES[z].n),lw=lab.length*4.6+8;const minY=Math.min.apply(null,pts.map(p=>p[1]));const top=pts.filter(p=>p[1]===minY)[0];
    const tx=clamp(top[0],2,318-lw),ty=clamp(minY-13,16,166);
    s+=`<rect x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${lw.toFixed(1)}" height="11" rx="2" fill="${c}"/><text x="${(tx+4).toFixed(1)}" y="${(ty+8).toFixed(1)}" class="zl" fill="${inkOn(c)}">${esc(lab)}</text>`;
    if(editor)pts.forEach((p,i)=>{s+=`<circle class="vtx" data-cam="${cam.id}" data-zone="${z}" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="#FFFFFF" stroke="${c}" stroke-width="2.2" tabindex="0" role="slider" aria-label="${esc(z+' · '+(i+1))}" aria-valuetext="${Math.round(p[0])}, ${Math.round(p[1])}"/>`;});
  }
  return s;
}
function boxesOverlay(dets,showGp){
  let s='';
  for(const d of dets){
    const p=d.p,col=d.working?'#0CA30C':'#FAB219',low=d.conf<.7;
    s+=`<rect x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" width="${p.w.toFixed(1)}" height="${p.h.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.4"${low?' stroke-dasharray="4 2.5"':''}/>`;
    const lbl=d.cls+' '+d.conf.toFixed(2),lw=lbl.length*4.35+6,lx=clamp(p.x,1,319-lw),ly=p.y>24?p.y-9:p.y+1;
    s+=`<rect x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" width="${lw.toFixed(1)}" height="9" fill="${col}"/><text x="${(lx+3).toFixed(1)}" y="${(ly+6.8).toFixed(1)}" class="bx">${esc(lbl)}</text>`;
    if(showGp&&d.cls!=='tower_crane')s+=`<circle cx="${d.gp[0].toFixed(1)}" cy="${d.gp[1].toFixed(1)}" r="2.3" fill="#FFFFFF" stroke="#111111" stroke-width=".8"/>`;
  }
  return s;
}

function camTile(c,f){

    const cams=CAMS.filter(c=>state.poly[c.id][z]);

    const sts=act.length?act.map(s=>chip(C.ev[s.id].rule)).join('<br>'):(nxt.length?chip(C.ev[nxt[0].id].rule):'');

    return;
  }
  const plot=e.target.closest&&e.target.closest('.tl-plot');
  if(plot){showTl(plot,e.clientX,e.clientY);return;}
  const hit=e.target.closest&&e.target.closest('.g-hit');
  if(hit){showGanttTip(hit.dataset.sid,e.clientX,e.clientY);return;}
  hideTip();
});
document.addEventListener('pointerup',()=>{if(dragging){dragging=null;render();}});
document.addEventListener('pointerleave',hideTip);
function hideTip(){const t=$('#tip');if(!t.hidden)t.hidden=true;$$('.tl-x').forEach(x=>x.hidden=true);}
function placeTip(cx,cy){const t=$('#tip');t.hidden=false;const r=t.getBoundingClientRect();let x=cx+14,y=cy+14;if(x+r.width>window.innerWidth-8)x=cx-r.width-14;if(y+r.height>window.innerHeight-8)y=cy-r.height-14;t.style.left=Math.max(8,x)+'px';t.style.top=Math.max(8,y)+'px';}
function showTl(plot,cx,cy){
  const rect=plot.getBoundingClientRect();const P=Number(plot.dataset.p);let t=Math.floor((cx-rect.left)/rect.width*SLOTS);t=clamp(t,0,SLOTS-1);
  const pctX=((t+.5)/SLOTS*100).toFixed(2)+'%';$$('.tl-x').forEach(x=>{x.hidden=false;x.style.left=pctX;});
  const sim=(state.report&&P===SLOTS)?state.report.sim:C.sim;
  let h=`<div class="th">${slotTime(t)}–${slotTime(t+1)}</div>`;
  if(t>=P)h+=`<div class="tr"><span>${esc(tr('afterShift'))}</span></div>`;
  else for(const s of tlStages()){const v=stageCounts(sim,s,t);h+=`<div class="tr"><span>${esc(s.wbs+' '+L(s.n))}</span><b>${v.cov?`${num(v.p,0)} / ${num(v.w,0)}`:esc(tr('tlNoDataCell'))}</b></div>`;}
  h+=`<div class="tr" style="margin-top:4px"><span class="small">${esc(tr('tlPresent'))} / ${esc(tr('tlWorking'))}</span></div>`;
  $('#tip').innerHTML=h;placeTip(cx,cy);
}
function showGanttTip(sid,cx,cy){
  const s=S(sid),r=state.report&&state.approved?state.report.ev[sid]:null;
  let h=`<div class="th">${esc(s.wbs+' '+L(s.n))}</div><div class="tr"><span>${esc(tr('gTipPlan',{a:fShort(D(s.start)),b:fShort(D(s.end))}))}</span></div><div class="tr"><span>${esc(tr('gTipFloat',{n:s.float}))}</span></div>`;
  if(r&&r.pace&&state.verdicts[sid]!=='recog')h+=`<div class="tr"><span>${esc(tr('gTipSpi',{spi:num(r.pace.spi,2)}))}</span></div><div class="tr"><span>${esc(tr('gTipFc',{fc:fShort(r.pace.fc),slip:signed(r.pace.slip,1),risk:tr('risk_'+r.pace.risk)}))}</span></div>`;
  $('#tip').innerHTML=h;placeTip(cx,cy);
}
document.addEventListener('focusin',e=>{const p=e.target.closest&&e.target.closest('.tl-plot');if(p){const r=p.getBoundingClientRect();showTl(p,r.left+r.width*frameSlot()/SLOTS,r.top+r.height);}});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.tl-plot'))hideTip();});

render();
})();
</script>

</body></html>
